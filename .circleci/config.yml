version: 2.1

orbs:
  win: circleci/windows@5.0

commands:
  install_and_verify:
    parameters:
      python:
        type: string
        default: python
    steps:
      - run:
          name: Install Firebreak
          command: << parameters.python >> -m pip install ".[dev]"
      - run:
          name: Check source
          command: |
            << parameters.python >> -m ruff check .
            << parameters.python >> -m ruff format --check .
      - run:
          name: Run tests
          command: << parameters.python >> -W error::ResourceWarning -m unittest discover -s tests -v
      - run:
          name: Produce portable evidence
          command: |
            << parameters.python >> -m firebreak corpus verify --output evidence
            << parameters.python >> -m firebreak certify --output evidence

jobs:
  linux:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - install_and_verify
      - store_artifacts:
          path: evidence
          destination: linux-evidence

  macos:
    macos:
      xcode: 27.0.0
    resource_class: m2pro.medium
    steps:
      - checkout
      - run:
          name: Install Python 3.12
          command: brew install python@3.12
      - install_and_verify:
          python: python3.12
      - store_artifacts:
          path: evidence
          destination: macos-evidence

  windows:
    executor: win/server-2022
    steps:
      - checkout
      - run:
          name: Select Python 3.12
          command: py -3.12 --version
      - install_and_verify:
          python: py -3.12
      - store_artifacts:
          path: evidence
          destination: windows-evidence

  container:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Install Firebreak
          command: python -m pip install .
      - run:
          name: Build isolated adapter
          command: docker build -f docker/adapter.Dockerfile -t technocore-firebreak-adapter:test .
      - run:
          name: Certify isolated adapter
          command: firebreak certify --docker-image technocore-firebreak-adapter:test --output evidence
      - store_artifacts:
          path: evidence
          destination: container-certification

  wheel:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Build wheel
          command: python -m pip wheel . --wheel-dir dist
      - run:
          name: Verify installed wheel outside the checkout
          command: |
            python -m venv /tmp/firebreak-wheel-test
            /tmp/firebreak-wheel-test/bin/python -m pip install dist/technocore_firebreak-0.1.0-py3-none-any.whl
            cd /tmp
            /tmp/firebreak-wheel-test/bin/firebreak corpus verify --output evidence
            /tmp/firebreak-wheel-test/bin/firebreak certify --output evidence
      - store_artifacts:
          path: /tmp/evidence
          destination: wheel-evidence

workflows:
  verify:
    jobs:
      - linux
      - macos
      - windows
      - container
      - wheel

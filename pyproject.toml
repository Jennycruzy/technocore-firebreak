[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-firebreak"
version = "0.4.0"
description = "Capability-safe reference consumer for hostile Technocore content"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Technocore Firebreak contributors"}]
dependencies = ["certifi>=2025.8.3", "cryptography>=43"]

[project.optional-dependencies]
dev = ["ruff==0.16.9"]

[project.scripts]
firebreak = "firebreak.cli:main"
firebreak-agent = "firebreak.agent:main"

[tool.setuptools.packages.find]
include = ["firebreak*"]

[tool.setuptools.package-data]
firebreak = ["data/*.json"]

[tool.ruff]
target-version = "py312"

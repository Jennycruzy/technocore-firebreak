name: test

# CircleCI is the required cross-platform workflow for this repository. Keep this
# workflow available for an explicit diagnostic run, but do not report failures on
# every push when GitHub-hosted runners are unavailable to the fork.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: firebreak --version

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: docker build -f docker/adapter.Dockerfile -t technocore-firebreak-adapter:test .
      - run: firebreak certify --docker-image technocore-firebreak-adapter:test --output evidence
      - uses: actions/upload-artifact@v4
        with:
          name: container-certification
          path: evidence/

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel . --wheel-dir dist
      - run: python -m venv /tmp/firebreak-wheel-test
      - run: /tmp/firebreak-wheel-test/bin/python -m pip install dist/technocore_firebreak-0.1.0-py3-none-any.whl
      - working-directory: /tmp
        run: /tmp/firebreak-wheel-test/bin/firebreak corpus verify --output evidence
      - working-directory: /tmp
        run: /tmp/firebreak-wheel-test/bin/firebreak certify --output evidence
